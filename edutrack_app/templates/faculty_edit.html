{% extends "base.html" %}
{% block title %}Edit Faculty | EduTrack{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">FACULTY RECORD</p><h1>Edit {{ item.full_name }}</h1></div><a class="btn btn-outline-primary" href="{{ url_for('admin.faculty') }}">Back to faculty</a></div>
<form method="post" class="panel"><div class="row g-3"><div class="col-md-4"><label class="form-label">Employee ID</label><input class="form-control" name="employee_id" value="{{ item.employee_id }}" required></div><div class="col-md-8"><label class="form-label">Full name</label><input class="form-control" name="full_name" value="{{ item.full_name }}" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ item.email }}" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ item.phone or '' }}"></div><div class="col-md-4"><label class="form-label">Department</label><select class="form-select" name="department_id" id="facultyDepartment" required>{% for dept in departments %}<option value="{{ dept.id }}" {% if item.department_id == dept.id %}selected{% endif %}>{{ dept.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Designation</label><input class="form-control" name="designation" value="{{ item.designation or '' }}"></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status"><option {% if item.status == 'Active' %}selected{% endif %}>Active</option><option {% if item.status == 'Inactive' %}selected{% endif %}>Inactive</option></select></div><div class="col-12"><label class="form-label">Assigned subjects</label><select class="form-select" name="subject_ids" id="facultySubjects" multiple size="5">{% for subject in subjects %}<option value="{{ subject.id }}" data-department="{{ subject.department_id }}" {% if subject.faculty_id == item.id %}selected{% endif %}>{{ subject.code }} — {{ subject.name }} (Semester {{ subject.semester }})</option>{% endfor %}</select><small class="text-muted">Hold Ctrl to select multiple subjects. Subjects are limited to the faculty member’s department.</small></div></div><div class="panel-footer mt-3"><button class="btn btn-primary">Save changes</button></div></form>
{% endblock %}
