{% extends "base.html" %}{% block title %}Settings | EduTrack{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">ACCOUNT</p><h1>Settings</h1></div></div>
<div class="settings-grid"><div class="panel"><h3>Profile</h3><div class="profile-summary"><span class="avatar xl">{{ current_user.name[:1] }}</span><div><strong>{{ current_user.name }}</strong><p>{{ current_user.email }}</p><span class="badge bg-primary-subtle text-primary">{{ current_user.role|title }}</span></div></div></div><div class="panel"><h3>Change password</h3><form method="post" action="{{ url_for('auth.change_password') }}" class="mt-3"><label class="form-label">Current password</label><input class="form-control" type="password" name="current_password" required><label class="form-label mt-3">New password</label><input class="form-control" type="password" name="new_password" minlength="8" required><button class="btn btn-primary mt-3">Update password</button></form></div></div>
{% endblock %}
