{% extends "base.html" %}
{% block title %}Edit Student | EduTrack{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">STUDENT RECORD</p><h1>Edit {{ item.full_name }}</h1></div><a class="btn btn-outline-primary" href="{{ url_for('admin.students') }}">Back to students</a></div>
<form method="post" class="panel"><div class="row g-3"><div class="col-md-4"><label class="form-label">Roll number</label><input class="form-control" name="roll_number" value="{{ item.roll_number }}" required></div><div class="col-md-8"><label class="form-label">Full name</label><input class="form-control" name="full_name" value="{{ item.full_name }}" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ item.email }}" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ item.phone or '' }}"></div><div class="col-md-4"><label class="form-label">Gender</label><select class="form-select" name="gender"><option {% if item.gender == 'Male' %}selected{% endif %}>Male</option><option {% if item.gender == 'Female' %}selected{% endif %}>Female</option><option {% if item.gender == 'Other' %}selected{% endif %}>Other</option></select></div><div class="col-md-4"><label class="form-label">Date of birth</label><input class="form-control" type="date" name="date_of_birth" value="{{ item.date_of_birth.isoformat() if item.date_of_birth else '' }}"></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status"><option {% if item.status == 'Active' %}selected{% endif %}>Active</option><option {% if item.status == 'Inactive' %}selected{% endif %}>Inactive</option></select></div><div class="col-md-4"><label class="form-label">Department</label><select class="form-select" name="department_id">{% for dept in departments %}<option value="{{ dept.id }}" {% if item.department_id == dept.id %}selected{% endif %}>{{ dept.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Course</label><select class="form-select" name="course_id">{% for course in courses %}<option value="{{ course.id }}" {% if item.course_id == course.id %}selected{% endif %}>{{ course.name }}</option>{% endfor %}</select></div><div class="col-md-2"><label class="form-label">Semester</label><input class="form-control" type="number" name="semester" min="1" max="8" value="{{ item.semester }}"></div><div class="col-md-2"><label class="form-label">Admission year</label><input class="form-control" type="number" name="admission_year" value="{{ item.admission_year }}"></div><div class="col-12"><label class="form-label">Address</label><textarea class="form-control" name="address">{{ item.address or '' }}</textarea></div></div><div class="panel-footer mt-3"><button class="btn btn-primary">Save changes</button></div></form>
{% endblock %}
