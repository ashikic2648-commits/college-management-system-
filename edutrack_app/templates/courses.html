{% extends "base.html" %}{% block title %}Courses | EduTrack{% endblock %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">ACADEMICS</p><h1>Courses</h1></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal"><i class="bi-plus-lg me-2"></i>Add course</button></div>
<div class="panel"><table class="table modern-table"><thead><tr><th>Name</th><th>Code</th><th>Department</th></tr></thead><tbody>{% for item in items %}<tr><td><strong>{{ item.name }}</strong></td><td>{{ item.code }}</td><td>{{ item.department.name }}</td></tr>{% else %}<tr><td colspan="3" class="empty-state">No courses found</td></tr>{% endfor %}</tbody></table></div>
<div class="modal fade" id="addModal"><div class="modal-dialog"><form method="post" class="modal-content"><div class="modal-header"><h5>New course</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><label class="form-label">Name</label><input class="form-control" name="name" required><label class="form-label mt-3">Code</label><input class="form-control" name="code" required><label class="form-label mt-3">Department</label><select class="form-select" name="department_id" required>{% for dept in departments %}<option value="{{ dept.id }}">{{ dept.name }}</option>{% endfor %}</select></div><div class="modal-footer"><button class="btn btn-primary">Save course</button></div></form></div></div>
{% endblock %}
